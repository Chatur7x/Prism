# Publishes the frontend bundle to GitHub Pages.
#
# ## What this deployment is, and is not
#
# It is the interface: the React bundle, its styles, and the welcome screen —
# everything a static host can serve. It is *not* the PRISM system. All state is
# owned by the Spring backend and MySQL, and a static host cannot run either.
# So the deployed build ships with `VITE_STATIC_ONLY=true`, which makes the UI
# say so in a banner rather than letting every request fail behind a
# sign-in form that looks like it should work.
#
# The bundle is built to talk to a real backend the moment `VITE_API_BASE` is
# pointed at one — see the "Deploying the API" section of the README. No source
# change is needed for that, only a build variable.
name: Deploy frontend to Pages

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  # Lets the site be rebuilt without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push must not be able to overwrite a newer
# build, and a half-finished upload must never be served.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the input, so a
      # drifted lockfile fails the build instead of silently resolving
      # something else.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        env:
          # Project pages are served from https://<user>.github.io/Prism/, so
          # every asset URL needs that prefix baked in.
          VITE_BASE_PATH: /Prism/
          # No backend is attached to this deployment. See the header comment.
          VITE_STATIC_ONLY: 'true'
        run: npm run build

      - name: Verify the SPA fallback was emitted
        working-directory: frontend
        run: |
          test -f dist/404.html
          grep -q '"/Prism/"' dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4