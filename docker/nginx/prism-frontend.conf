# =============================================================================
# PRISM frontend: static assets plus a same-origin API reverse proxy.
# =============================================================================
#
# WHY A REVERSE PROXY RATHER THAN A BUILD-TIME API URL
#   Pointing the browser at http://backend:8080 directly would make the frontend
#   carry its deployment topology, force CORS on every request, and break server
#   sent events in a way that is painful to debug from a browser. Serving both
#   from one origin removes all three problems at once: the bundle is
#   environment-independent, the browser never makes a cross-origin request, and
#   SSE works without any special casing.
#
# The cost is that nginx must understand the streaming case. It does not by
# default: proxy_buffering holds responses in memory and a buffered event stream
# arrives in bursts, or not at all, which makes a live debate look frozen. The
# /api/debates/*/stream location below disables it for exactly that reason.
#
# A second cost is that this proxy is the security boundary, so it has to speak
# correctly on two axes the static file server never has to think about: the
# Origin header (see the /api/ block) and upstream address changes (see the
# resolver). Both are handled below, and both were previously wrong.
# =============================================================================

# Docker's embedded DNS, re-read rather than cached. nginx resolves an upstream
# name exactly once, at startup, and then holds the address forever. Recreating
# the backend container gives it a new IP, and until nginx is reloaded every API
# call fails with 502 even though the backend is healthy and its own healthcheck
# is passing — which reads as "the app is broken" and is not. Pointing proxy_pass
# at a variable that interpolates this address makes nginx re-resolve, at the
# cost of losing the upstream keepalive pool, which is irrelevant for an API
# this size and is a fair trade for surviving a backend restart.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads. The application's own limit is enforced server-side by Spring's
    # multipart configuration, which produces a real error message; this ceiling
    # exists only so an oversized body is rejected at the edge instead of being
    # buffered in full by nginx first.
    client_max_body_size 25m;

    # ---- compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ---- security headers ------------------------------------------------
    # These are set at the edge because that is the only place they are
    # guaranteed to apply to every response, including error pages nginx
    # generates itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # The API is same-origin and loads nothing cross-origin, so the policy can be
    # strict. 'unsafe-inline' for style-src is required by the inline style
    # attributes the layout uses for one-off spacing; script-src is not relaxed.
    # Real-header CSP. `frame-ancestors` is here rather than in index.html's
    # <meta> policy because browsers ignore that directive when it arrives in a
    # meta element — the meta copy omits it deliberately. This is the copy that
    # actually enforces clickjacking protection, alongside X-Frame-Options above.
    # `connect-src 'self'` needs no host entry because this proxy makes the API
    # same-origin; see the /api/ block below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- API proxy -------------------------------------------------------
    location /api/ {
        # Interpolated, not literal, so the `resolver` above is consulted on
        # every request instead of only at startup. See the resolver comment.
        set $prism_backend "http://backend:8080";
        proxy_pass $prism_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the backend builds absolute redirects and any absolute
        # URL it emits points at the container name, which the browser cannot
        # resolve.
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- Why Origin is cleared, and why that is not a hole ----------
        #
        # CORS is a *browser* mechanism. It exists so a page on origin A cannot
        # read a response from origin B. Through this proxy there is no such
        # pair: the browser requested http://localhost:5173/api/... and received
        # the reply from http://localhost:5173/api/... — one origin, so the
        # browser applied no CORS check and there is nothing left to protect.
        #
        # Forwarding the header anyway actively breaks it. Spring's CorsFilter
        # decides from the presence of Origin whether a request is cross-origin;
        # pass the header through and the backend sees a cross-origin request,
        # finds its allow-list empty (which the WebSecurityConfig documents as
        # "same-origin only, no cross-origin access"), and answers 403
        # "Invalid CORS request" — for a request the browser considered
        # same-origin and had every right to make. The result is a login screen
        # that cannot log in, with an error message naming a cause that did not
        # happen.
        #
        # Clearing it does not weaken the deployment:
        #   * authentication is a JWT bearer token, not a cookie, so there is no
        #     ambient credential for a cross-site request to ride on;
        #   * a genuinely cross-origin browser request — the Vite dev server
        #     calling :8080 directly — does not come through this file at all,
        #     and is still refused by the empty allow-list;
        #   * `*` remains rejected at boot, and `allowCredentials` is irrelevant
        #     when there is no Origin to validate against.
        # What it removes is the browser-only header, not a check.
        proxy_set_header Origin "";

        # The request correlation filter reads this; when absent every request
        # would be logged as [no-trace] and the Glass Box would lose the thread
        # between an error in the browser and the step that caused it.
        proxy_set_header X-Request-Id      $request_id;

        # A restarted backend should surface as a retryable 503 with a real
        # message, not an opaque 502 the UI has to guess about.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Long enough for verify-all, which performs a retrieval and a model call
        # per claim and is legitimately slow. Shorter than this and a 50-claim
        # batch is cut off by the proxy rather than by the application.
        proxy_read_timeout    900s;
    }

    # ---- server-sent events ----------------------------------------------
    # A long-lived response with a trickle of events. Buffering must be off, and
    # the chunked encoding must reach the browser untouched, or the Council
    # chamber appears to hang until the debate finishes.
    location ~ ^/api/debates/[^/]+/stream$ {
        # Same re-resolution reasoning as the /api/ block above.
        set $prism_backend_stream "http://backend:8080";
        proxy_pass $prism_backend_stream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # See the long note in the /api/ block: through this proxy the browser
        # request was same-origin, so the header is cleared rather than relayed.
        proxy_set_header Origin "";
        proxy_set_header X-Request-Id      $request_id;

        # EventSource sends no custom headers, so the browser's access token
        # arrives as a query parameter. nginx is told to pass it through
        # untouched rather than treating the query string as a cache key.
        proxy_pass_request_headers on;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # A debate round can take a while per persona, so the read timeout is
        # generous. The stream itself is expected to be quiet between events.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- health ----------------------------------------------------------
    # `return 200 "..."` already answers as text/plain, so no add_header here.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---- static assets ---------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so these are safe to
    # cache forever: a changed file gets a new name.
    #
    # `expires` is used rather than `add_header Cache-Control` throughout, and
    # that is deliberate. nginx's add_header does not merge: a single add_header
    # in a location block discards every add_header inherited from the server
    # level, so a cache-control header added here would silently strip the
    # security headers above from this path. `expires` is a separate directive
    # and does not disturb add_header inheritance.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ---- SPA fallback ---------------------------------------------------
    # Every unmatched path returns index.html and lets the client-side router
    # decide, so a deep link such as /glassbox/42 survives a page refresh.
    # `expires -1` emits `Cache-Control: no-cache`, so index.html is revalidated
    # on every load and a new deployment is picked up without a hard refresh.
    #
    # The `=404` on assets above is what stops this fallback from quietly
    # serving index.html in response to a missing JavaScript bundle, which would
    # present as a blank page with no error anywhere.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
