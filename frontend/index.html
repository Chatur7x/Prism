<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      CSP is also set by nginx in production. This meta policy covers the dev
      server, where nginx is not in the path. 'unsafe-inline' for styles only:
      React injects a style tag at runtime. Scripts are NOT permitted inline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8080; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>PRISM — auditable AI analysis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
